name: Project3 CI CD

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:

  build:
    name: Build and Push GHCR
    runs-on: self-hosted

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./Skills_Utilization
          file: ./Skills_Utilization/Dockerfile
          push: true
          tags: |
            ghcr.io/ymkv5/project3:latest
            ghcr.io/ymkv5/project3:${{ github.sha }}

  deploy:
    name: Deploy
    needs: build
    runs-on: self-hosted

    permissions:
      contents: read
      packages: read

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull GHCR Image
        run: |
          docker pull ghcr.io/ymkv5/project3:latest

      - name: Deploy with Vault
        run: |
          cd /home/aau/Desktop/project3
          ./vault.sh

      - name: Check Containers
        run: |
          cd /home/aau/Desktop/project3
          docker compose ps
